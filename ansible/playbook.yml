# =============================================================================
# Ansible Playbook — Full Kubernetes DevOps Platform
# =============================================================================
---

# =============================================================================
# Play 1 — Prepare all Kubernetes nodes
# =============================================================================
- name: Prepare Kubernetes nodes
  hosts: k8s_cluster
  become: true
  gather_facts: true
  tags:
    - base
    - k8s
  roles:
    - role: common
    - role: nfs_client
    - role: containerd
    - role: kubernetes

# =============================================================================
# Play 2 — Initialize Kubernetes control plane
# =============================================================================
- name: Initialize Kubernetes control plane
  hosts: masters
  become: true
  gather_facts: false
  tags:
    - base
    - k8s
    - master
  roles:
    - role: master
    - role: cni

# =============================================================================
# Play 3 — Join worker nodes
# =============================================================================
- name: Join worker nodes to the cluster
  hosts: workers
  become: true
  gather_facts: false
  tags:
    - base
    - k8s
    - workers
  roles:
    - role: workers

# =============================================================================
# Play 4 — Prepare services VM
# =============================================================================
- name: Prepare services node
  hosts: services
  become: true
  gather_facts: true
  tags:
    - services
  roles:
    - role: common
    - role: nfs_server
    - role: docker
    - role: gitea
    - role: nexus

# =============================================================================
# Play 5 — Configure Docker on Kubernetes workers for local registry
# =============================================================================
- name: Configure Docker on workers for CI/CD support
  hosts: workers
  become: true
  gather_facts: false
  tags:
    - docker-workers
  roles:
    - role: docker

# =============================================================================
# Play 6 — Deploy Kubernetes applications
# =============================================================================
- name: Deploy Kubernetes applications
  hosts: masters
  become: false
  gather_facts: false
  tags:
    - apps
  roles:
    - role: mysql
    - role: backend
    - role: frontend
    - role: jenkins

# =============================================================================
# Play 7 — Deploy ingress
# =============================================================================
- name: Deploy ingress-nginx and app ingress
  hosts: masters
  become: false
  gather_facts: false
  tags:
    - ingress
  roles:
    - role: ingress

# =============================================================================
# Play 8 — Deploy Vault dev server
# =============================================================================
- name: Deploy Vault dev server
  hosts: services
  become: true
  gather_facts: false
  tags:
    - vault
  roles:
    - role: vault

# =============================================================================
# Play 9 — Validate cluster
# =============================================================================
- name: Validate Kubernetes cluster
  hosts: masters
  become: false
  gather_facts: false
  tags:
    - validate
    - always
  tasks:
    - name: Wait for all nodes to be Ready
      ansible.builtin.shell: |
        kubectl get nodes --no-headers | grep -v " Ready " | wc -l
      register: not_ready_count
      until: not_ready_count.stdout | trim | int == 0
      retries: 60
      delay: 10
      changed_when: false

    - name: Get node status
      ansible.builtin.command: kubectl get nodes -o wide
      register: nodes_output
      changed_when: false

    - name: Display node status
      ansible.builtin.debug:
        msg: "{{ nodes_output.stdout_lines }}"

    - name: Get pod status across all namespaces
      ansible.builtin.command: kubectl get pods -A -o wide
      register: pods_output
      changed_when: false

    - name: Display pod status
      ansible.builtin.debug:
        msg: "{{ pods_output.stdout_lines }}"