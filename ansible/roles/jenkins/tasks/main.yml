# =============================================================================
# Role: jenkins — Deploy Jenkins as a K8s pod in jenkins namespace
# =============================================================================
# Runs on: masters (become: false, as vagrant user with kubectl)
# =============================================================================
---

# 1. Copy manifest files to master
- name: Create Jenkins manifests directory
  ansible.builtin.file:
    path: /tmp/k8s-jenkins
    state: directory
    mode: "0755"

- name: Copy Jenkins manifest files
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: /tmp/k8s-jenkins/
  loop:
    - namespace.yaml
    - serviceaccount.yaml
    - pv.yaml
    - pvc.yaml
    - deployment.yaml
    - service.yaml

# 2. Apply manifests in order
- name: Apply Jenkins namespace
  ansible.builtin.command: kubectl apply -f /tmp/k8s-jenkins/namespace.yaml
  changed_when: true

- name: Apply Jenkins ServiceAccount and ClusterRoleBinding
  ansible.builtin.command: kubectl apply -f /tmp/k8s-jenkins/serviceaccount.yaml
  changed_when: true

- name: Apply Jenkins PersistentVolume
  ansible.builtin.command: kubectl apply -f /tmp/k8s-jenkins/pv.yaml
  changed_when: true

- name: Apply Jenkins PersistentVolumeClaim
  ansible.builtin.command: kubectl apply -f /tmp/k8s-jenkins/pvc.yaml
  changed_when: true

- name: Apply Jenkins Service
  ansible.builtin.command: kubectl apply -f /tmp/k8s-jenkins/service.yaml
  changed_when: true

- name: Apply Jenkins Deployment
  ansible.builtin.command: kubectl apply -f /tmp/k8s-jenkins/deployment.yaml
  changed_when: true

# 3. Wait for Jenkins to be ready
- name: Wait for Jenkins Deployment to be ready
  ansible.builtin.command: kubectl rollout status deployment/jenkins -n jenkins --timeout=300s
  changed_when: false

# 4. Configure kubeconfig for Jenkins pipelines (tokenFile avoids token expiry issues)
- name: Get Jenkins pod name
  ansible.builtin.command: kubectl get pods -n jenkins -l app=jenkins -o jsonpath='{.items[0].metadata.name}'
  register: jenkins_pod_name
  changed_when: false

- name: Ensure Jenkins kubeconfig directory exists
  ansible.builtin.command: kubectl exec -n jenkins {{ jenkins_pod_name.stdout }} -- mkdir -p /var/jenkins_home/.kube
  changed_when: true

- name: Create Jenkins kubeconfig using in-cluster ServiceAccount files
  ansible.builtin.shell: |
    kubectl exec -i -n jenkins {{ jenkins_pod_name.stdout }} -- sh -c 'cat > /var/jenkins_home/.kube/config' <<'EOF'
    apiVersion: v1
    kind: Config
    clusters:
      - name: kubernetes
        cluster:
          server: https://kubernetes.default.svc:443
          certificate-authority: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
    contexts:
      - name: jenkins
        context:
          cluster: kubernetes
          user: jenkins
    current-context: jenkins
    users:
      - name: jenkins
        user:
          tokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
    EOF
  changed_when: true

- name: Secure Jenkins kubeconfig permissions
  ansible.builtin.command: kubectl exec -n jenkins {{ jenkins_pod_name.stdout }} -- chmod 600 /var/jenkins_home/.kube/config
  changed_when: true
